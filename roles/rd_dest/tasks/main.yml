- name: Ensure destination PVC exists with requested spec
  kubernetes.core.k8s:
    context: "{{ k8s_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: "{{ item.metadata.name }}"
        namespace: "{{ item.metadata.namespace }}"
        labels:
          "dr/managed": "true"
      spec:
        accessModes: "{{ item.spec.accessModes }}"
        storageClassName: "{{ dest_storage_class }}"
        volumeMode: "{{ item.spec.volumeMode | default('Block') }}"
        resources:
          requests:
            storage: "{{ item.spec.resources.requests.storage }}"
  loop: "{{ discovered_pvcs }}"
  loop_control:
    label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"
    loop_var: item

- name: Create/patch RD for each PVC on destination
  kubernetes.core.k8s:
    context: "{{ k8s_context }}"
    state: present
    definition: "{{ lookup('template', 'replicationdestination.yml.j2') }}"
  loop: "{{ discovered_pvcs }}"
  loop_control:
    label: "{{ item.metadata.namespace }}/rd-{{ item.metadata.name }}"

# ── LoadBalancer path ────────────────────────────────────────────────────────

- name: Wait for RD LoadBalancer address
  when: rd_service_type | default('LoadBalancer') == 'LoadBalancer'
  kubernetes.core.k8s_info:
    context: "{{ k8s_context }}"
    api_version: volsync.backube/v1alpha1
    kind: ReplicationDestination
    name: "rd-{{ item.metadata.name }}"
    namespace: "{{ item.metadata.namespace }}"
  register: rd_lb_info
  until: >
    rd_lb_info.resources | length > 0 and
    (rd_lb_info.resources[0].status | default({})).rsyncTLS is defined and
    (rd_lb_info.resources[0].status.rsyncTLS.address | default('')) != ''
  retries: 36
  delay: 10
  loop: "{{ discovered_pvcs }}"
  loop_control:
    label: "{{ item.metadata.namespace }}/rd-{{ item.metadata.name }}"

- name: Build rd_address_map from LoadBalancer addresses
  when: rd_service_type | default('LoadBalancer') == 'LoadBalancer'
  set_fact:
    rd_address_map: >-
      {{ (rd_address_map | default({})) | combine({
           item.item.metadata.name: item.resources[0].status.rsyncTLS.address
         }) }}
  loop: "{{ rd_lb_info.results }}"
  loop_control:
    label: "{{ item.item.metadata.namespace }}/rd-{{ item.item.metadata.name }}"

# ── NodePort path ────────────────────────────────────────────────────────────

- name: Get a Ready destination node (NodePort mode)
  when: rd_service_type | default('LoadBalancer') == 'NodePort'
  kubernetes.core.k8s_info:
    context: "{{ k8s_context }}"
    api_version: v1
    kind: Node
  register: dest_nodes_info

- name: Set destination node IP (NodePort mode)
  when: rd_service_type | default('LoadBalancer') == 'NodePort'
  set_fact:
    dest_node_ip: >-
      {{ dest_nodes_info.resources
         | map(attribute='status.addresses')
         | flatten
         | selectattr('type', 'equalto', 'InternalIP')
         | map(attribute='address')
         | first }}

- name: Wait for RD NodePort service to be assigned
  when: rd_service_type | default('LoadBalancer') == 'NodePort'
  kubernetes.core.k8s_info:
    context: "{{ k8s_context }}"
    api_version: v1
    kind: Service
    namespace: "{{ item.metadata.namespace }}"
    label_selectors:
      - "volsync.backube/replicationdestination=rd-{{ item.metadata.name }}"
  register: rd_svc_info
  until: >
    rd_svc_info.resources | length > 0 and
    (rd_svc_info.resources[0].spec.ports | default([]) | length) > 0 and
    (rd_svc_info.resources[0].spec.ports[0].nodePort | default(0)) > 0
  retries: 24
  delay: 10
  loop: "{{ discovered_pvcs }}"
  loop_control:
    label: "{{ item.metadata.namespace }}/rd-{{ item.metadata.name }}"

- name: Build rd_address_map from NodePort addresses
  when: rd_service_type | default('LoadBalancer') == 'NodePort'
  set_fact:
    rd_address_map: >-
      {{ (rd_address_map | default({})) | combine({
           item.item.metadata.name: dest_node_ip ~ ':' ~ (item.resources[0].spec.ports[0].nodePort | string)
         }) }}
  loop: "{{ rd_svc_info.results }}"
  loop_control:
    label: "{{ item.item.metadata.namespace }}/rd-{{ item.item.metadata.name }}"
